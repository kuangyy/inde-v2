[package]
name = "inde-rs"
version = "0.1.0"
edition = "2021"
description = "Standalone rewrite of the inde personal site with the Escape Script text game"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
axum-extra = { version = "0.10", features = ["cookie"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "time"] }
tower-http = { version = "0.6", features = ["trace", "compression-gzip"] }
askama = "0.14"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "derive", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
chrono = "0.4"
time = "0.3"
pulldown-cmark = "0.12"
ammonia = "4"
mime_guess = "2"
rust-embed = "8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
percent-encoding = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
