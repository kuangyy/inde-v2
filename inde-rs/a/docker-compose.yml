services:
  a:
    image: ${A_IMAGE:-ky-oooc-ink:local}
    build: .
    container_name: ky-oooc-ink
    restart: unless-stopped
    ports:
      - "${A_PORT:-18080}:80"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
