<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>oooc.ink</title>
<meta name="description" content="oooc.ink">
<meta name="author" content="ky">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌊</text></svg>">
<style>
  :root {
    --bg1: #eef2ff;
    --bg2: #fdf2f8;
    --bg3: #ecfeff;
    --fg: #1f2937;
    --muted: #6b7280;
    --card: rgba(255, 255, 255, .72);
    --card-hover: rgba(255, 255, 255, .95);
    --line: rgba(31, 41, 55, .08);
    --accent: #4f46e5;
    --shadow: 0 10px 30px rgba(79, 70, 229, .10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg1: #0f172a;
      --bg2: #1e1b4b;
      --bg3: #042f2e;
      --fg: #e5e7eb;
      --muted: #9ca3af;
      --card: rgba(255, 255, 255, .06);
      --card-hover: rgba(255, 255, 255, .12);
      --line: rgba(255, 255, 255, .10);
      --accent: #a5b4fc;
      --shadow: 0 10px 30px rgba(0, 0, 0, .35);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100svh;
    padding: 32px 20px;
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: linear-gradient(120deg, var(--bg1), var(--bg2), var(--bg3));
    background-size: 300% 300%;
    animation: drift 24s ease-in-out infinite;
    -webkit-font-smoothing: antialiased;
  }
  @keyframes drift {
    0%, 100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
  }

  main { width: 100%; max-width: 720px; text-align: center; }

  .clock {
    font-size: clamp(28px, 6vw, 46px);
    font-weight: 700;
    letter-spacing: .04em;
    font-variant-numeric: tabular-nums;
  }
  .subtitle {
    margin-top: 10px;
    color: var(--muted);
    font-size: 14px;
    letter-spacing: .3em;
  }

  .links {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin: 48px 0 0;
    list-style: none;
  }
  @media (max-width: 560px) {
    .links { grid-template-columns: repeat(2, 1fr); }
  }
  .links a {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 22px 10px;
    border: 1px solid var(--line);
    border-radius: 18px;
    background: var(--card);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow: var(--shadow);
    color: var(--fg);
    text-decoration: none;
    transition: transform .25s ease, background .25s ease, border-color .25s ease;
  }
  .links a:hover,
  .links a:focus-visible {
    transform: translateY(-4px);
    background: var(--card-hover);
    border-color: var(--accent);
    outline: none;
  }
  .links .num {
    font-size: 26px;
    font-weight: 700;
    color: var(--accent);
  }
  .links .name { font-size: 14px; color: var(--muted); }

  .player {
    display: flex;
    align-items: center;
    gap: 14px;
    max-width: 460px;
    margin: 28px auto 0;
    padding: 12px 16px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--card);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    text-align: left;
  }
  .player .play {
    flex: none;
    width: 40px;
    height: 40px;
    border: none;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    transition: transform .2s ease;
  }
  .player .play:hover { transform: scale(1.06); }
  .player .meta { flex: 1; min-width: 0; }
  .player .track { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player .track span { color: var(--muted); }
  .player .bar {
    height: 4px;
    margin-top: 8px;
    border-radius: 2px;
    background: var(--line);
    cursor: pointer;
  }
  .player .fill { width: 0; height: 100%; border-radius: 2px; background: var(--accent); }
  .player .time {
    flex: none;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 40px;
    z-index: 10;
    padding: 10px 20px;
    border-radius: 999px;
    background: rgba(17, 24, 39, .88);
    color: #fff;
    font-size: 14px;
    letter-spacing: .08em;
    opacity: 0;
    transform: translate(-50%, 12px);
    pointer-events: none;
    transition: opacity .25s ease, transform .25s ease;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  footer {
    margin-top: 56px;
    font-size: 13px;
    color: var(--muted);
  }
  footer a { color: inherit; text-decoration: none; border-bottom: 1px dotted currentColor; }

  @media (prefers-reduced-motion: reduce) {
    body { animation: none; }
    .links a { transition: none; }
  }
</style>
</head>
<body>
<main>
  <div class="clock" id="clock">&nbsp;</div>
  <div class="subtitle">OOOC.INK</div>

  <!-- 链接按需修改；点击统一提示「建设中」 -->
  <ul class="links">
    <li><a href="/blog" data-name="文字"><span class="num">壹</span><span class="name">文字</span></a></li>
    <li><a href="/game" data-name="游戏"><span class="num">贰</span><span class="name">游戏</span></a></li>
    <li><a href="/books" data-name="书籍"><span class="num">叁</span><span class="name">书籍</span></a></li>
    <li><a href="/photos" data-name="照片"><span class="num">肆</span><span class="name">照片</span></a></li>
  </ul>

  <div class="player">
    <button class="play" id="playBtn" type="button" aria-label="播放">▶</button>
    <div class="meta">
      <div class="track">关于我爱你 <span>— 张悬</span></div>
      <div class="bar" id="bar"><div class="fill" id="fill"></div></div>
    </div>
    <div class="time" id="time">00:00</div>
    <audio id="audio" src="audio/a.mp3" loop preload="none"></audio>
  </div>

  <footer>
    <span>[ky]</span> / <span id="year"></span> / pure static
  </footer>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
  (function () {
    var clock = document.getElementById('clock');
    var year = document.getElementById('year');
    var pad = function (n) { return n < 10 ? '0' + n : '' + n; };
    function tick() {
      var d = new Date();
      clock.textContent =
        d.getFullYear() + '/' + pad(d.getMonth() + 1) + '/' + pad(d.getDate()) +
        ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
      year.textContent = d.getFullYear();
    }
    tick();
    setInterval(tick, 1000);

    var audio = document.getElementById('audio');
    var playBtn = document.getElementById('playBtn');
    var bar = document.getElementById('bar');
    var fill = document.getElementById('fill');
    var time = document.getElementById('time');
    var mmss = function (s) {
      if (!isFinite(s)) return '00:00';
      s = Math.floor(s);
      return pad(Math.floor(s / 60)) + ':' + pad(s % 60);
    };
    playBtn.addEventListener('click', function () {
      if (audio.paused) {
        audio.play();
      } else {
        audio.pause();
      }
    });
    audio.addEventListener('play', function () { playBtn.textContent = '❚❚'; });
    audio.addEventListener('pause', function () { playBtn.textContent = '▶'; });
    audio.addEventListener('timeupdate', function () {
      var pct = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
      fill.style.width = pct + '%';
      time.textContent = audio.duration
        ? mmss(audio.currentTime) + ' / ' + mmss(audio.duration)
        : mmss(audio.currentTime);
    });
    bar.addEventListener('click', function (e) {
      if (!audio.duration) return;
      var r = bar.getBoundingClientRect();
      audio.currentTime = ((e.clientX - r.left) / r.width) * audio.duration;
    });

    var toast = document.getElementById('toast');
    var toastTimer;
    document.querySelectorAll('.links a').forEach(function (a) {
      a.addEventListener('click', function (e) {
        e.preventDefault();
        toast.textContent = (a.getAttribute('data-name') || '页面') + ' · 建设中';
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          toast.classList.remove('show');
        }, 1800);
      });
    });
  })();
</script>
</body>
</html>
