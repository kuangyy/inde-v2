<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>About - {{ ctx.site_title }}</title>
    <link rel="icon" href="/assets/img/angry.png">
    <link rel="stylesheet" href="/assets/css/index.css">
    <link rel="stylesheet" href="/assets/css/site.css">
    <style>
        body {
            overflow-y: auto !important;
            background: #222;
            color: #fff;
        }
        #canvas-container { margin-top: 0; }
        .about-wrap {
            position: relative;
            z-index: 200;
            max-width: 760px;
            margin: 0 auto;
            padding: 14vh 24px 80px;
        }
        .about .title {
            font-size: 64px;
            line-height: 1.1;
            color: #f35626;
            background-image: linear-gradient(92deg, #f35626, #feab3a);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .about-body { margin-top: 28px; line-height: 1.9; font-size: 17px; color: #eee; }
        .about-body a { color: #70fef7; }
        .back { display: inline-block; margin-top: 40px; color: #9ad; }
    </style>
</head>
<body>
<div id="canvas-container" class="animated fadeInUp layer" data-depth="0.1">
    <canvas id="gravity"></canvas>
</div>

<div class="about-wrap">
    <div class="about">
        <h1 class="title">关于/About</h1>
        <div class="about-body">{{ about_html|safe }}</div>
        <a class="back" href="/">← 返回首页</a>
    </div>
</div>

<script src="/assets/js/jquery.min.js"></script>
<script src="/assets/js/star.js"></script>
</body>
</html>
