{% extends "manage/base.html" %}
{% block title %}{% if is_new %}添加书籍{% else %}编辑书籍{% endif %}{% endblock %}
{% block content %}
<div class="admin-head">
    <h1>{% if is_new %}添加书籍{% else %}编辑书籍{% endif %}</h1>
    <a class="btn" href="/manage/books">返回列表</a>
</div>
{% if error != "" %}<p class="alert error">{{ error }}</p>{% endif %}
<form method="post" action="{% if is_new %}/manage/books{% else %}/manage/books/{{ id }}{% endif %}" class="admin-form">
    <input type="hidden" name="csrf" value="{{ ctx.csrf }}">
    <label>书名<input type="text" name="name" value="{{ name }}" required></label>
    <label>作者<input type="text" name="author" value="{{ author }}"></label>
    <label>评分（0–10）<input type="number" name="score" value="{{ score }}" min="0" max="10" step="0.1"></label>
    <label>简介<textarea name="summary" rows="3">{{ summary }}</textarea></label>
    <label>封面图片地址
        <span class="input-with-button">
            <input type="text" name="cover" id="cover-input" value="{{ cover }}" placeholder="/uploads/...">
            <button type="button" class="btn small" data-upload-target="#cover-input">上传</button>
        </span>
    </label>
    <label>下载 / 查看链接<input type="text" name="download_url" value="{{ download_url }}" placeholder="https://..."></label>
    <label>详细内容（Markdown）<textarea name="content_md" rows="14" class="editor-area">{{ content_md }}</textarea></label>
    <div class="form-actions">
        <button class="btn primary" type="submit">保存</button>
        <a class="btn" href="/manage/books">取消</a>
    </div>
</form>
{% endblock %}
