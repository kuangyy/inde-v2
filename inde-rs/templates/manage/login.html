<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>后台登录 - {{ site_title }}</title>
    <link rel="icon" href="/assets/img/angry.png">
    <link rel="stylesheet" href="/assets/css/admin.css">
</head>
<body class="admin-login-body">
<div class="admin-login-card">
    <h1>管理后台</h1>
    <p class="muted">{{ site_title }}</p>
    {% if error != "" %}<p class="alert error">{{ error }}</p>{% endif %}
    <form method="post" action="/manage/login" class="form">
        <label>密码
            <input type="password" name="password" autocomplete="current-password" required autofocus>
        </label>
        <label class="checkbox"><input type="checkbox" name="remember" value="1"> 记住我 7 天</label>
        <button class="btn primary" type="submit">登录</button>
    </form>
    <p class="muted"><a href="/">← 返回首页</a></p>
</div>
</body>
</html>
