{% extends "manage/base.html" %}
{% block title %}{% if is_new %}添加图片{% else %}编辑图片{% endif %}{% endblock %}
{% block content %}
<div class="admin-head">
    <h1>{% if is_new %}添加图片{% else %}编辑图片{% endif %}</h1>
    <a class="btn" href="/manage/photos">返回列表</a>
</div>
{% if error != "" %}<p class="alert error">{{ error }}</p>{% endif %}
<form method="post" action="{% if is_new %}/manage/photos{% else %}/manage/photos/{{ id }}{% endif %}" class="admin-form">
    <input type="hidden" name="csrf" value="{{ ctx.csrf }}">
    <label>名称<input type="text" name="name" value="{{ name }}" placeholder="可选"></label>
    <label>图片地址
        <span class="input-with-button">
            <input type="text" name="url" id="photo-url" value="{{ url }}" placeholder="/uploads/...">
            <button type="button" class="btn small" data-upload-target="#photo-url">上传</button>
        </span>
    </label>
    <label>排序（数字小的在前）<input type="number" name="sort_order" value="{{ sort_order }}"></label>
    <div class="form-actions">
        <button class="btn primary" type="submit">保存</button>
        <a class="btn" href="/manage/photos">取消</a>
    </div>
</form>
{% endblock %}
