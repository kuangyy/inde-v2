{% extends "manage/base.html" %}
{% block title %}{% if is_new %}新建文章{% else %}编辑文章{% endif %}{% endblock %}
{% block content %}
<div class="admin-head">
    <h1>{% if is_new %}新建文章{% else %}编辑文章{% endif %}</h1>
    <a class="btn" href="/manage/posts">返回列表</a>
</div>
{% if error != "" %}<p class="alert error">{{ error }}</p>{% endif %}
<form method="post" action="{% if is_new %}/manage/posts{% else %}/manage/posts/{{ id }}{% endif %}" class="admin-form">
    <input type="hidden" name="csrf" value="{{ ctx.csrf }}">
    <label>标题<input type="text" name="title" value="{{ title }}" required></label>
    <label>摘要（留空自动截取正文）<textarea name="summary" rows="2">{{ summary }}</textarea></label>
    <label>标签（逗号分隔）<input type="text" name="tags" value="{{ tags }}" placeholder="随笔, Rust"></label>
    <label>封面图片地址
        <span class="input-with-button">
            <input type="text" name="cover" id="cover-input" value="{{ cover }}" placeholder="/uploads/...">
            <button type="button" class="btn small" data-upload-target="#cover-input">上传</button>
        </span>
    </label>
    <label class="checkbox"><input type="checkbox" name="published" value="1"{% if published %} checked{% endif %}> 发布</label>

    <label>正文（Markdown）
        <span class="editor-toolbar">
            <button type="button" class="btn small" id="editor-upload-btn">上传图片并插入</button>
            <button type="button" class="btn small" id="preview-btn">预览</button>
            <span class="muted" id="editor-status"></span>
        </span>
        <textarea name="body_md" id="body_md" rows="20" class="editor-area">{{ body_md }}</textarea>
    </label>
    <div id="preview" class="preview-box markdown-body" hidden></div>

    <div class="form-actions">
        <button class="btn primary" type="submit">保存</button>
        <a class="btn" href="/manage/posts">取消</a>
    </div>
</form>
<input type="file" id="editor-file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
{% endblock %}
