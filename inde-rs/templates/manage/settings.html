{% extends "manage/base.html" %}
{% block title %}站点设置{% endblock %}
{% block content %}
<div class="admin-head">
    <h1>站点设置</h1>
</div>
{% if notice != "" %}<p class="alert notice">{{ notice }}</p>{% endif %}

<h2>基本信息</h2>
<form method="post" action="/manage/settings/save" class="admin-form">
    <input type="hidden" name="csrf" value="{{ ctx.csrf }}">
    <label>站点标题<input type="text" name="site_title" value="{{ site_title }}"></label>
    <label>副标题<input type="text" name="site_subtitle" value="{{ site_subtitle }}"></label>
    <label>背景音乐地址<input type="text" name="audio_url" value="{{ audio_url }}" placeholder="/assets/audio/a.mp3"></label>
    <label>关于页 HTML（会被安全过滤）
        <textarea name="about_html" rows="10" class="editor-area">{{ about_html }}</textarea>
    </label>
    <div class="form-actions"><button class="btn primary" type="submit">保存设置</button></div>
</form>

<h2>首页格言</h2>
<div class="motto-list">
    {% for motto in mottos %}
    <div class="motto-row">
        <div>
            <p>{{ motto.name }}</p>
            {% if motto.translate != "" %}<p class="muted">{{ motto.translate }}</p>{% endif %}
        </div>
        <form method="post" action="/manage/mottos/{{ motto.id }}/delete" onsubmit="return confirm('删除这条格言？');">
            <input type="hidden" name="csrf" value="{{ ctx.csrf }}">
            <button class="btn danger small" type="submit">删除</button>
        </form>
    </div>
    {% endfor %}
</div>
<form method="post" action="/manage/mottos" class="admin-form">
    <input type="hidden" name="csrf" value="{{ ctx.csrf }}">
    <label>格言内容<input type="text" name="name" required></label>
    <label>出处 / 翻译（可选）<input type="text" name="translate"></label>
    <div class="form-actions"><button class="btn" type="submit">添加格言</button></div>
</form>
{% endblock %}
